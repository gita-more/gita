# Gita production deployment with Docker/Podman
#
# Usage:
#   1. Copy .env.example to .env and customize (especially JWT_SECRET!)
#   2. docker-compose up -d     (or: podman-compose up -d)
#
# Services:
#   - gita: main application (Rust backend + React frontend)
#   - postgres: PostgreSQL with pgvector for relational data + semantic search
#
# Notes:
#   - Host port 3000 is often occupied; the default maps 3100 -> 3000.
#     Override with GITA_PORT in .env if you want a different port.
#   - By default the app uses SQLite (no DATABASE_URL set). To use Postgres,
#     set DATABASE_URL=postgres://gita:gita@postgres:5432/gita in .env.

services:
  gita:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gita
    restart: unless-stopped
    ports:
      - "${GITA_PORT:-3100}:3000"
    environment:
      # Server
      - GITA_SERVER_HOST=0.0.0.0
      - GITA_SERVER_PORT=3000
      - GITA_SERVER_DATA_DIR=/data
      # Default to SQLite; set DATABASE_URL in .env to use Postgres.
      - GITA_SERVER_DATABASE_URL=${DATABASE_URL:-sqlite:///data/gita.db}
      # CHANGE THIS IN PRODUCTION! Use a strong random string (64+ chars)
      - GITA_SERVER_JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      # LLM (optional - leave empty for stub reviews)
      - GITA_LLM_BASE_URL=${LLM_BASE_URL:-}
      - GITA_LLM_API_KEY=${LLM_API_KEY:-}
      - GITA_LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - GITA_LLM_TIMEOUT_SECS=60
    volumes:
      # Persist repositories and the SQLite database
      - gita-data:/data
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: gita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gita}
      POSTGRES_DB: gita
    # No host port exposed by default; only reachable inside the compose network.
    volumes:
      - gita-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gita -d gita"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gita-data:
  gita-pgdata:
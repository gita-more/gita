# Gita production deployment with Docker/Podman
#
# Usage:
#   1. Copy .env.example to .env and customize (especially JWT_SECRET!)
#   2. docker-compose up -d     (or: podman-compose up -d)
#
# Services:
#   - gita: main application (Rust backend + React frontend)
#   - postgres: PostgreSQL for relational data
#
# Notes:
#   - Host port 3000 is often occupied; the default maps 3100 -> 3000.
#     Override with GITA_PORT in .env if you want a different port.
#   - The app connects to the bundled `postgres` service. To use an external
#     Postgres, override DATABASE_URL in .env (e.g.
#     DATABASE_URL=postgres://gita:gita@localhost:55432/gita).

services:
  gita:
    build:
      # 本 compose 文件位于 docker/，故 context 取上一级（即项目根），
      # 让 Dockerfile 里的 COPY target/ web/ config/ docker/ 都能解析。
      # context: ..
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gita
    restart: unless-stopped
    ports:
      - "${GITA_PORT:-3100}:3000"
      # Git over SSH (port 2222). This mapping is commented out by default:
      # the SSH listener is disabled unless GITA_SSH_ENABLED=true, so there is
      # nothing to connect to. To expose SSH, set GITA_SSH_ENABLED=true in
      # .env AND uncomment the line below (optionally override GITA_SSH_PORT):
      # - "${GITA_SSH_PORT:-2222}:2222"
    environment:
      # Server
      - GITA_SERVER_HOST=0.0.0.0
      - GITA_SERVER_PORT=3000
      - GITA_SERVER_DATA_DIR=/data
      # Connect to the bundled postgres service. Override DATABASE_URL in .env
      # to point at an external Postgres instead.
      - GITA_SERVER_DATABASE_URL=${DATABASE_URL:-postgres://gita:gita@postgres:5432/gita}
      # CHANGE THIS IN PRODUCTION! Use a strong random string (64+ chars)
      - GITA_SERVER_JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      # Embedded SSH server (Git over SSH). Disabled by default.
      - GITA_SERVER_SSH_ENABLED=${GITA_SSH_ENABLED:-false}
      - GITA_SERVER_SSH_HOST=0.0.0.0
      - GITA_SERVER_SSH_PORT=2222
    volumes:
      # Persist repositories (database state lives in the postgres volume)
      - gita-data:/data
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: gita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gita}
      POSTGRES_DB: gita
    # No host port exposed by default; only reachable inside the compose network.
    volumes:
      - gita-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gita -d gita"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gita-data:
  gita-pgdata:

[package]
name = "gita-db"
description = "PostgreSQL data access layer for Gita; ships sqlx migrations for schema versioning"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
gita-core = { path = "../gita-core" }

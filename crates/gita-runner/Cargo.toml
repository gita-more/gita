[package]
name = "gita-runner"
description = "In-repo CI runner — a separate binary that polls and executes pipeline runs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono"] }
gita-core = { path = "../gita-core" }
gita-db = { path = "../gita-db" }
gita-pipeline = { path = "../gita-pipeline" }

[dev-dependencies]
tempfile = "3"
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
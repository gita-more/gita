[package]
name = "gita-runner"
description = "In-repo CI runner — polls the gita server for pipeline runs and executes them"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gita_runner"
path = "src/lib.rs"

[[bin]]
name = "gita-runner"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
gita-core = { path = "../gita-core" }
gita-db = { path = "../gita-db" }
gita-pipeline = { path = "../gita-pipeline" }
gita-workflow = { path = "../gita-workflow" }
gita-ci = { path = "../gita-ci" }
hex = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

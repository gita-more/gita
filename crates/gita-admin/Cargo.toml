[package]
name = "gita-admin"
description = "Gita admin CLI - server, CI infra, and runner management"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
dotenvy = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
gita-client = { path = "../gita-client" }
gita-core = { path = "../gita-core" }
gita-db = { path = "../gita-db" }
gita-git = { path = "../gita-git" }
gita-events = { path = "../gita-events" }
gita-http = { path = "../gita-http" }
gita-api = { path = "../gita-api" }
gita-web = { path = "../gita-web" }
gita-ssh = { path = "../gita-ssh" }
gita-ci = { path = "../gita-ci" }
gita-workflow = { path = "../gita-workflow" }
gita-push = { path = "../gita-push" }
gita-runner = { path = "../gita-runner" }
gita-vm-api = { path = "../gita-vm-api" }
gita-vm-core = { path = "../gita-vm-core" }
gita-vm-store = { path = "../gita-vm-store" }
gita-vm-control = { path = "../gita-vm-control" }

[dev-dependencies]
tempfile = "3"
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
reqwest = { workspace = true, features = ["blocking", "json"] }
serde_json = { workspace = true }


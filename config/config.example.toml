# Gita configuration example.
# Copy to config/gita.toml and adjust as needed.

[server]
# Bind address. Use 0.0.0.0 to expose to the network.
host = "127.0.0.1"
port = 3000
# Directory for repositories and database.
data_dir = "data"
# PostgreSQL connection URL. This project is PostgreSQL-only.
# For local development, docker-compose in docker/ sets up a Postgres service
# (default user/pass: gita/gita).
database_url = "postgres://gita:gita@localhost:5432/gita"
# Secret used to sign JWTs. Change this in production!
jwt_secret = "dev-secret-change-me"

# GitHub-Pages-style static site serving. When enabled (the default), a
# repository with Pages configured publishes its site at
#   http://<host>/<owner>/<repo>/
# from a branch and folder of your choosing ("/" or "/docs").
pages_enabled = true
# Optional URL prefix for all Pages sites, e.g. "/p" serves
# http://<host>/p/<owner>/<repo>/. Empty means no prefix.
# pages_url_prefix = "/p"

# Password reset. There is no mail transport wired up, so a reset token
# has no way to reach the user by mail. When this is true, the
# password-reset response carries the token in a `reset_token` field, so
# an operator can complete the flow by hand.
#
# Leave it off in production: the response is identical for existing and
# non-existent accounts, so returning the token would let an anonymous
# caller both enumerate accounts and take them over.
# allow_insecure_password_reset = true

[server.ssh]
# Embedded SSH server for Git over SSH (clone/push via git@host:owner/repo.git).
# Disabled by default; set to true to enable.
enabled = false
# Bind address for the SSH listener.
host = "127.0.0.1"
# Port for the SSH listener. Use 22 if you want the standard SSH port.
port = 2222
# Path to the OpenSSH-format host private key. Defaults to
# <data_dir>/ssh_host_ed25519_key and is auto-generated on first run.
# host_key = "data/ssh_host_ed25519_key"

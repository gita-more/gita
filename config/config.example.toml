# Gita configuration example.
# Copy to config/gita.toml and adjust as needed.

[server]
# Bind address. Use 0.0.0.0 to expose to the network.
host = "127.0.0.1"
port = 3000
# Directory for repositories and database.
data_dir = "data"
# PostgreSQL connection URL. This project is PostgreSQL-only.
# For local development, docker-compose in docker/ sets up a Postgres service
# (default user/pass: gita/gita).
database_url = "postgres://gita:gita@localhost:5432/gita"
# Secret used to sign JWTs. Change this in production!
jwt_secret = "dev-secret-change-me"

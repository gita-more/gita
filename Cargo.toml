[workspace]
resolver = "2"
members = [
    "crates/gita-core",
    "crates/gita-db",
    "crates/gita-pipeline",
    "crates/gita-push",
    "crates/gita-git",
    "crates/gita-events",
    "crates/gita-http",
    "crates/gita-api",
    "crates/gita-server",
    "crates/gita-web",
    "crates/gita-runner",
    "crates/gita-ssh",
    "client",
    "integration/cli",
    "integration/api",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/gita-more/gita"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# web framework
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "auth"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "json", "macros", "chrono", "uuid"] }

# git
gix = "0.89"

# http client (for LLM calls)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# auth
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }

# time & misc
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rand = "0.8"
dotenvy = "0.15"
base64 = "0.22"
governor = "0.7"

# webhook payload signing
hmac = "0.12"
sha2 = "0.10"

# cli
# `keyring` uses platform-specific backends (Linux Secret Service, macOS
# Keychain, Windows Credential Manager). The workspace dep keeps
# default-features off and no backend enabled; `client/Cargo.toml` selects
# the backend per target so cross-compilation for release matrices works.
keyring = { version = "3", default-features = false }
url = "2.5"

# Warnings are errors: the tree must stay warning-clean. Lint config lives
# here; every workspace member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"

[workspace]
resolver = "2"
members = [
    "crates/gita-core",
    "crates/gita-db",
    "crates/gita-git",
    "crates/gita-events",
    "crates/gita-ai",
    "crates/gita-http",
    "crates/gita-api",
    "crates/gita-mcp",
    "crates/gita-server",
    "crates/gita-web",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/gita/gita"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "auth"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# database
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "json"] }

# git
gix = "0.89"

# http client (for LLM calls)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# auth
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }

# time & misc
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"
dotenvy = "0.15"
base64 = "0.22"

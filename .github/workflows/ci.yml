name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gita
          POSTGRES_PASSWORD: gita
          POSTGRES_DB: gita
        ports:
          # The Rust test suite connects to 127.0.0.1:55432 by default, so
          # we map the container's 5432 to the host's 55432.
          - 5432:55432
        options: >-
          --health-cmd "pg_isready -h localhost -U gita -d gita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ssh openssh-client postgresql-client

      - name: Wait for Postgres
        # Defensive: even with --health-cmd, the first test step may run before
        # pg_isready reports "accepting connections" on the TCP socket the test
        # suite uses. Loop until a TCP connect + SELECT 1 succeeds.
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 55432 -U gita -d gita >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres (attempt $i)..."
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Run workspace tests
        env:
          DATABASE_URL: postgres://gita:gita@localhost:55432/gita
          GITA_TEST_DATABASE_URL: postgres://gita:gita@localhost:55432/gita
        run: cargo test --workspace

  web:
    name: Web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary
        run: ./target/release/gita-server --version
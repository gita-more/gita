name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gita
          POSTGRES_PASSWORD: gita
          POSTGRES_DB: gita
        ports:
          # The Rust test suite connects to 127.0.0.1:55432 by default, so
          # we map the container's 5432 (where postgres listens) to the host's
          # 55432. Format is HOST:CONTAINER.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U gita -d gita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ssh openssh-client postgresql-client libdbus-1-dev pkg-config

      - name: Wait for Postgres
        # Defensive: even with --health-cmd, the first test step may run before
        # pg_isready reports "accepting connections" on the TCP socket the test
        # suite uses. Loop until psql can connect on the host port the test
        # suite will use.
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=gita psql -h localhost -p 55432 -U gita -d gita -c 'SELECT 1' >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres (attempt $i)..."
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Build binaries
        # The CLI integration tests invoke the `gita` client binary from
        # `target/debug/gita`. `cargo test` only builds bins for its own
        # harness under target/debug/deps/, so build them explicitly.
        run: cargo build -p gita-admin -p gita

      - name: Run workspace tests
        env:
          DATABASE_URL: postgres://gita:gita@localhost:55432/gita
          GITA_TEST_DATABASE_URL: postgres://gita:gita@localhost:55432/gita
        # The JUnit report is what the test-report step below turns into
        # a PR comment. Without it, a failure in a 791-test run is a
        # wall of log output with no indication of which test broke.
        run: cargo nextest run --workspace --no-fail-fast --profile ci

      - name: Run doctests
        env:
          DATABASE_URL: postgres://gita:gita@localhost:55432/gita
          GITA_TEST_DATABASE_URL: postgres://gita:gita@localhost:55432/gita
        # nextest does not run doctests; keep them in the gate explicitly.
        run: cargo test --workspace --doc

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-report
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-file format check needs the base commit.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format changed Rust files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./ci/check-fmt.sh

      - name: Clippy
        # The tree still carries pre-existing style lints, so the gate is
        # the two categories that catch real bugs: correctness and
        # suspicious constructs. Tighten this to `-D warnings` once the
        # remaining style lints are cleared.
        run: cargo clippy --workspace --all-targets --keep-going -- -A warnings -D clippy::correctness -D clippy::suspicious

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses:EmbarkStudios/cargo-deny-action@v2

      # rustsec/audit-check above finds the crates with a known
      # vulnerability. cargo-deny finds the rest: a dependency whose
      # licence does not permit this project's use of it, a crate that
      # was pulled in twice in different versions, and a source that is
      # not the one the lockfile says it is.
      - name: Check the dependency graph
        run: cargo deny check

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit the npm dependencies
        working-directory: web
        run: npm audit --audit-level=high

  web:
    name: Web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Test
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gita
          POSTGRES_PASSWORD: gita
          POSTGRES_DB: gita
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U gita -d gita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git libdbus-1-dev pkg-config

      - name: Build the frontend
        # The server serves `web/dist` (found relative to the checkout),
        # so it must exist before gita-admin starts.
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Build the server (gita-admin)
        run: cargo build -p gita-admin

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: integration/web

      - name: Start gita-admin
        run: |
          cat > gita-e2e.toml <<'EOF'
          [server]
          host = "127.0.0.1"
          port = 3100
          data_dir = "e2e-data"
          database_url = "postgres://gita:gita@localhost:55432/gita"
          jwt_secret = "ci-e2e-secret"

          [server.vm]
          enabled = true
          api_key = "e2e-vm-key"
          EOF
          ./target/debug/gita-admin -c gita-e2e.toml &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health > /dev/null 2>&1; then
              echo "gita-admin is ready"
              exit 0
            fi
            echo "Waiting for gita-admin (attempt $i)..."
            sleep 1
          done
          echo "gita-admin did not become ready in time"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: integration/web

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: integration/web/test-results/
          retention-days: 7

  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    # Instrumented builds run the whole suite several times slower, so
    # this job does not gate a pull request — the `test` job does that.
    # It does run on a pull request, though, and it reports what it
    # found: a change that quietly drops a thousand covered lines is
    # invisible otherwise, and "invisible" is how coverage goes down.
    #
    # On a push to main the job also enforces the floor.
    if: always()
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gita
          POSTGRES_PASSWORD: gita
          POSTGRES_DB: gita
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U gita -d gita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git libdbus-1-dev pkg-config

      - name: Generate coverage
        env:
          DATABASE_URL: postgres://gita:gita@localhost:55432/gita
          GITA_TEST_DATABASE_URL: postgres://gita:gita@localhost:55432/gita
        # --ignore-tests would only measure unit tests; leaving the
        # integration tests in is the point — they are where most of the
        # API surface is exercised.
        #
        # The floor is a ratchet, not a target: a full instrumented run
        # currently reports ~80% of lines covered. The CLI crate is low
        # because its integration tests execute the release-shaped binary
        # as a subprocess, which coverage cannot see; 75% keeps that known
        # blind spot from hiding a real regression elsewhere.
        #
        # The floor is enforced on main only. On a pull request the same
        # measurement runs, but a threshold that a pull request cannot
        # meet is a threshold nobody looks at.
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info --summary-only
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Enforcing the coverage floor on main."
            cargo llvm-cov report --fail-under-lines 75
          else
            echo "Reporting coverage without enforcing the floor."
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info
          retention-days: 30

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary
        run: ./target/release/gita-admin --version
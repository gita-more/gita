name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release on the test suite. A tag push is a separate trigger
  # from CI's (push-to-main / pull_request), so without this job a release
  # could publish an artifact that no test had ever run against.
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gita
          POSTGRES_PASSWORD: gita
          POSTGRES_DB: gita
        ports:
          # The test suite connects to 127.0.0.1:55432 by default.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U gita -d gita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ssh openssh-client postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=gita psql -h localhost -p 55432 -U gita -d gita -c 'SELECT 1' >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres (attempt $i)..."
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Build binaries
        # The CLI integration tests invoke the `gita-server` binary from
        # `target/debug/gita-server`, which `cargo test` does not build.
        run: cargo build -p gita-server

      - name: Run workspace tests
        env:
          DATABASE_URL: postgres://gita:gita@localhost:55432/gita
          GITA_TEST_DATABASE_URL: postgres://gita:gita@localhost:55432/gita
        run: cargo test --workspace

  release:
    name: Build and publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ssh openssh-client

      - name: Build release binaries
        run: |
          cargo build --release
          cargo build --release -p gita-runner

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Assemble release artifacts
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          DIST="dist/gita-${TAG}"
          mkdir -p "${DIST}"
          # Server binary + web dist (deployed together; the binary resolves
          # web/dist relative to its own location).
          cp target/release/gita-server "${DIST}/gita-server"
          cp -r web/dist "${DIST}/web"
          # Standalone CI runner binary.
          cp target/release/gita-runner "${DIST}/gita-runner"
          # Deployment templates.
          cp config/config.example.toml "${DIST}/config.example.toml"
          cp docker/Dockerfile "${DIST}/Dockerfile"
          cp docker/docker-entrypoint.sh "${DIST}/docker-entrypoint.sh"
          cp docker/docker-compose.yml "${DIST}/docker-compose.yml"
          cp README.md LICENSE "${DIST}/"
          # Compress.
          tar -czf "gita-${TAG}.tar.gz" "${DIST}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "created gita-${TAG}.tar.gz"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/gita-more/gita"
          docker build -f docker/Dockerfile -t "${IMAGE}:${TAG}" .
          docker build -f docker/Dockerfile -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gita-${{ env.TAG }}.tar.gz
          generate_release_notes: true